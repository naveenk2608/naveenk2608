<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="28" viewBox="0 0 1000 28" role="img" aria-label="divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#2dd4bf" stop-opacity="0.7"/>
      <stop offset="0.75" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="1"    stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#e6edf3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e6edf3" stop-opacity="0.95"/>
      <stop offset="1"   stop-color="#e6edf3" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .spark { animation: travel 3.2s ease-in-out infinite; }
    .dot   { animation: glow 3.2s ease-in-out infinite; }
    @keyframes travel { from { transform: translateX(-140px); } to { transform: translateX(1000px); } }
    @keyframes glow   { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="30" y="13" width="940" height="2" rx="1" fill="url(#line)"/>
  <rect class="spark" x="0" y="12" width="140" height="4" rx="2" fill="url(#spark)"/>
  <circle cx="470" cy="14" r="2.5" fill="#2dd4bf" opacity="0.8"/>
  <rect class="dot" x="493" y="7" width="14" height="14" rx="3" fill="#0f2738" stroke="#38bdf8" stroke-width="2" transform="rotate(45 500 14)"/>
  <circle cx="530" cy="14" r="2.5" fill="#38bdf8" opacity="0.8"/>
</svg>
