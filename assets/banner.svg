<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Naveen Kumar. Full Stack Developer and Problem Solver. CSE at VIT-AP University.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="0.55" stop-color="#0c1b2b"/>
      <stop offset="1" stop-color="#0f2a3b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1d3a4d"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <style>
    .hello { font: 500 20px Consolas, 'Fira Code', Menlo, 'DejaVu Sans Mono', monospace; fill: #2dd4bf; }
    .name  { font: 700 68px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #e6edf3; letter-spacing: -1px; }
    .role  { font: 600 26px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: url(#accent); }
    .meta  { font: 400 17px Consolas, 'Fira Code', Menlo, 'DejaVu Sans Mono', monospace; fill: #8b949e; }
    .lbl   { font: 500 13px Consolas, 'Fira Code', Menlo, 'DejaVu Sans Mono', monospace; fill: #8b949e; text-anchor: middle; }
    .in    { font: 600 12px Consolas, 'Fira Code', Menlo, 'DejaVu Sans Mono', monospace; fill: #c9d1d9; text-anchor: middle; dominant-baseline: central; }
    .gw    { font: 700 17px Consolas, 'Fira Code', Menlo, 'DejaVu Sans Mono', monospace; fill: #e6edf3; text-anchor: middle; dominant-baseline: central; }

    .link  { fill: none; stroke: #23465a; stroke-width: 2; }
    .pulse { fill: none; stroke: url(#accent); stroke-width: 3; stroke-linecap: round;
             stroke-dasharray: 6 44; animation: flow 1.8s linear infinite; }
    .node  { fill: #0e2131; stroke: #38bdf8; stroke-width: 2; }
    .soft  { fill: #0e2131; stroke: #2dd4bf; stroke-width: 2; }
    .gwbox { fill: #0f2738; stroke: url(#accent); stroke-width: 2.5; animation: breathe 2.4s ease-in-out infinite; }
    .cursor{ fill: #2dd4bf; animation: blink 1.1s steps(1) infinite; }
    .led   { fill: #2dd4bf; animation: blink 1.6s ease-in-out infinite; }

    @keyframes flow    { to { stroke-dashoffset: -50; } }
    @keyframes blink   { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
    @keyframes breathe { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.45; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- card -->
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)" opacity="0.7"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="#1f3b4d" stroke-width="2"/>

  <!-- left: intro text -->
  <text x="66" y="92" class="hello">&gt; hello, world. I'm</text>
  <rect x="300" y="76" width="11" height="20" class="cursor"/>
  <text x="60" y="166" class="name">Naveen Kumar</text>
  <rect x="66" y="186" width="96" height="4" rx="2" fill="url(#accent)"/>
  <text x="66" y="230" class="role">Full Stack Developer · Problem Solver</text>
  <text x="66" y="272" class="meta">CSE @ VIT-AP University  ·  Class of 2027  ·  India</text>

  <!-- right: request flow, clients -> REST API -> cloud and databases -->
  <path class="link"  d="M751 95 C795 95 800 150 840 150"/>
  <path class="link"  d="M751 160 L840 160"/>
  <path class="link"  d="M751 225 C795 225 800 170 840 170"/>
  <path class="link"  d="M970 150 C1000 150 1002 86 1030 86"/>
  <path class="link"  d="M970 160 C1000 160 1006 165 1037 165"/>
  <path class="link"  d="M970 170 C1000 170 1006 250 1040 250"/>

  <path class="pulse" d="M751 95 C795 95 800 150 840 150"/>
  <path class="pulse" d="M751 160 L840 160" style="animation-delay:-0.6s"/>
  <path class="pulse" d="M751 225 C795 225 800 170 840 170" style="animation-delay:-1.2s"/>
  <path class="pulse" d="M970 150 C1000 150 1002 86 1030 86" style="animation-delay:-0.3s"/>
  <path class="pulse" d="M970 160 C1000 160 1006 165 1037 165" style="animation-delay:-0.9s"/>
  <path class="pulse" d="M970 170 C1000 170 1006 250 1040 250" style="animation-delay:-1.5s"/>

  <circle cx="735" cy="95"  r="17" class="soft"/><text x="735" y="95"  class="in">web</text>
  <circle cx="735" cy="160" r="17" class="soft"/><text x="735" y="160" class="in">app</text>
  <circle cx="735" cy="225" r="17" class="soft"/><text x="735" y="225" class="in">user</text>

  <rect x="840" y="126" width="130" height="68" rx="12" class="gwbox"/>
  <text x="905" y="160" class="gw">REST API</text>
  <circle cx="955" cy="138" r="4" class="led"/>

  <!-- AWS cloud -->
  <path class="node" d="M1030 100 H1100 A16 16 0 0 0 1102 68 A24 24 0 0 0 1057 60 A18 18 0 0 0 1030 76 A12 12 0 0 0 1030 100 Z"/>
  <text x="1068" y="120" class="lbl">aws</text>

  <!-- MySQL cylinder -->
  <path class="node" d="M1037 150 V180 A28 8 0 0 0 1093 180 V150"/>
  <ellipse cx="1065" cy="150" rx="28" ry="8" class="node"/>
  <path d="M1037 165 A28 8 0 0 0 1093 165" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
  <text x="1065" y="206" class="lbl">mysql</text>

  <!-- MongoDB documents -->
  <rect x="1040" y="232" width="50" height="36" rx="7" class="node"/>
  <rect x="1050" y="241" width="30" height="4" rx="2" fill="#38bdf8" opacity="0.8"/>
  <rect x="1050" y="248" width="30" height="4" rx="2" fill="#2dd4bf" opacity="0.8"/>
  <rect x="1050" y="255" width="30" height="4" rx="2" fill="#38bdf8" opacity="0.5"/>
  <text x="1065" y="288" class="lbl">mongodb</text>
</svg>
